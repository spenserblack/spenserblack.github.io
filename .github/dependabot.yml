version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      astro-and-friends:
        patterns:
          - astro
          - "@astrojs/*"
          - svelte
          - prettier-plugin-astro
          - prettier-plugin-svelte
      steamdown:
        patterns:
          - "@steamdown/*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
